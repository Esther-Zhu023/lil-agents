<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lil Agents</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
      pointer-events: none;
      user-select: none;
    }
    #overlay {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .character-wrapper {
      position: absolute;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
      cursor: pointer;
      /* No CSS transition — JS animation loop handles all movement */
    }
    .char-video {
      width: 100px;
      height: 180px;
      object-fit: contain;
      background: transparent;
      image-rendering: -webkit-optimize-contrast;
    }
    /* AI provider dot */
    .ai-dot {
      position: absolute;
      bottom: 175px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.9);
      z-index: 2;
    }
    /* Character label */
    .char-label {
      margin-top: 4px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 4px rgba(0,0,0,0.6), 0 0 8px rgba(0,0,0,0.4);
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 8px;
    }
    /* Thinking bubble */
    .thinking-bubble {
      position: absolute;
      bottom: 200px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      color: #333;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .thinking-bubble.visible { opacity: 1; }
  </style>
</head>
<body>
  <div id="overlay">
    <!-- Characters injected by JS -->
  </div>

  <script>
    const CHARACTERS = [
      { id: 0, name: 'Bruce', aiProvider: 'hermes',   color: '#66b88c', position: 0.15 },
      { id: 1, name: 'Jazz',  aiProvider: 'openclaw', color: '#ff6600', position: 0.38 },
      { id: 2, name: 'Nova',  aiProvider: 'claude',  color: '#3366cc', position: 0.62 },
      { id: 3, name: 'Zoey',  aiProvider: 'hermes',  color: '#00cccc', position: 0.85 },
    ];

    const AI_COLORS = {
      hermes:   '#C19C5F',
      openclaw: '#10A37F',
      claude:   '#7952CC',
      codex:    '#0081CC',
      copilot:  '#7C3AED',
      gemini:   '#DB6821',
      opencode: '#0081CC',
    };

    // Walker state per character — mirrors macOS Swift logic
    const WALK_DURATION = 10.04; // seconds per video loop

    const CHAR_ANIM = [
      // Bruce
      { accelStart: 3.0, fullSpeedStart: 3.75, decelStart: 8.0,  walkStop: 8.5,  walkAmountRange: [0.4, 0.65] },
      // Jazz
      { accelStart: 3.9, fullSpeedStart: 4.5,  decelStart: 8.0,  walkStop: 8.75, walkAmountRange: [0.35, 0.6] },
      // Nova
      { accelStart: 3.5, fullSpeedStart: 4.2,  decelStart: 8.0,  walkStop: 8.6,  walkAmountRange: [0.38, 0.58] },
      // Zoey
      { accelStart: 3.3, fullSpeedStart: 4.0,  decelStart: 8.0,  walkStop: 8.7,  walkAmountRange: [0.36, 0.62] },
    ];

    const THINKING_PHRASES = [
      'thinking…', 'hmm…', 'processing…', 'typing…', 'analyzing…',
      'searching…', 'calculating…', 'considering…'
    ];

    // Per-char audio buffers
    let audioBuffers = {};

    // Characters state
    const states = CHARACTERS.map((c, i) => ({
      ...c,
      x: c.position,
      goingRight: Math.random() > 0.5,
      walking: false,
      walkStartX: c.position,
      walkEndX: 0,
      walkStartTime: 0,
      anim: CHAR_ANIM[i],
      thinking: false,
      thinkingText: '',
      thinkingTimer: 0,
      pauseEnd: 0,
    }));

    // Build DOM
    const overlay = document.getElementById('overlay');
    const bubbles = {};

    for (const s of states) {
      const wrapper = document.createElement('div');
      wrapper.className = 'character-wrapper';
      wrapper.id = `char-${s.id}`;
      wrapper.style.left = `${s.x * 100}%`;

      const dot = document.createElement('div');
      dot.className = 'ai-dot';
      dot.style.background = AI_COLORS[s.aiProvider] || '#888';

      const video = document.createElement('video');
      video.className = 'char-video';
      video.id = `video-${s.id}`;
      video.src = `../assets/videos/walk-${s.name.toLowerCase()}.webm`;
      video.loop = false;
      video.muted = true;
      video.playsInline = true;
      video.preload = 'auto';

      const label = document.createElement('div');
      label.className = 'char-label';
      label.id = `label-${s.id}`;
      label.style.background = s.color;
      label.textContent = s.name;

      const bubble = document.createElement('div');
      bubble.className = 'thinking-bubble';
      bubble.id = `bubble-${s.id}`;
      bubbles[s.id] = bubble;

      wrapper.appendChild(dot);
      wrapper.appendChild(video);
      wrapper.appendChild(bubble);
      wrapper.appendChild(label);
      overlay.appendChild(wrapper);

      // Click to open chat
      wrapper.addEventListener('click', () => {
        if (window.electronAPI && window.electronAPI.openChat) {
          window.electronAPI.openChat(s.id);
        }
      });

      // Start video when ready
      video.addEventListener('loadeddata', () => {
        video.play().catch(() => {});
      });

      video.addEventListener('ended', () => {
        if (s.walking) {
          video.currentTime = 0;
          video.play().catch(() => {});
        }
      });

      video.addEventListener('timeupdate', () => {
        if (!s.walking && !video.paused) {
          video.pause();
        }
      });
    }

    // Speed curve — same as macOS Swift
    function getSpeedFraction(t, anim) {
      // t is time since walk started in seconds
      if (t < anim.accelStart) return 0;
      if (t < anim.fullSpeedStart) {
        // ease in
        const p = (t - anim.accelStart) / (anim.fullSpeedStart - anim.accelStart);
        return p * p; // quadratic ease in
      }
      if (t < anim.decelStart) return 1.0;
      if (t < anim.walkStop) {
        // ease out
        const p = (anim.walkStop - t) / (anim.walkStop - anim.decelStart);
        return 1.0 - (p * p);
      }
      return 0;
    }

    // Walk — pick destination, walk there, pause, repeat
    function startWalk(s) {
      s.walking = true;
      s.walkStartX = s.x;
      const walkDist = s.anim.walkAmountRange[0] +
        Math.random() * (s.anim.walkAmountRange[1] - s.anim.walkAmountRange[0]);

      if (s.goingRight) {
        s.walkEndX = Math.min(s.walkStartX + walkDist, 0.85);
      } else {
        s.walkEndX = Math.max(s.walkStartX - walkDist, 0.08);
      }

      s.goingRight = !s.goingRight;
      s.walkStartTime = performance.now() / 1000;

      const video = document.getElementById(`video-${s.id}`);
      video.currentTime = 0;
      video.play().catch(() => {});
    }

    function updateCharacter(s, now) {
      const wrapper = document.getElementById(`char-${s.id}`);

      if (!s.walking) {
        // Random pause — then start new walk
        if (now > s.pauseEnd) {
          startWalk(s);
        }
        return;
      }

      const elapsed = now - s.walkStartTime;

      // Use elapsed modulo WALK_DURATION for frac (keeps t in valid range)
      // But cap at walkStop so frac never regresses when video loops
      const t = Math.min(elapsed % WALK_DURATION, s.anim.walkStop);
      const frac = getSpeedFraction(t, s.anim);

      const totalDist = s.walkEndX - s.walkStartX;
      s.x = s.walkStartX + totalDist * frac;
      s.x = Math.max(0.05, Math.min(0.88, s.x));

      wrapper.style.left = `${s.x * 100}%`;

      // End walk when elapsed exceeds walkStop
      if (elapsed >= s.anim.walkStop) {
        s.x = s.walkEndX;
        wrapper.style.left = `${s.x * 100}%`;
        s.walking = false;

        // Random pause 2-6 seconds
        s.pauseEnd = now + 2 + Math.random() * 4;

        const video = document.getElementById(`video-${s.id}`);
        video.pause();
      }

      // Thinking bubble
      if (s.thinking) {
        bubbles[s.id].classList.add('visible');
        bubbles[s.id].textContent = s.thinkingText;
        s.thinkingTimer -= 16;
        if (s.thinkingTimer <= 0) {
          s.thinking = false;
          bubbles[s.id].classList.remove('visible');
        }
      }
    }

    // Main loop
    let lastFrame = performance.now() / 1000;
    function frame(nowMs) {
      const now = nowMs / 1000;
      const dt = now - lastFrame;
      lastFrame = now;

      for (const s of states) {
        updateCharacter(s, now);
      }

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // Initial random start delays
    for (const s of states) {
      s.pauseEnd = Math.random() * 3;
    }

    // IPC from main process
    if (window.electronAPI) {
      window.electronAPI.onSetCharacterAI = (data) => {
        const s = states.find(s => s.id === data.characterId);
        if (!s) return;
        s.aiProvider = data.provider;
        const dot = document.querySelector(`#char-${s.id} .ai-dot`);
        if (dot) dot.style.background = AI_COLORS[data.provider] || '#888';
      };

      window.electronAPI.onSetThinking = (data) => {
        const s = states.find(s => s.id === data.characterId);
        if (!s) return;
        s.thinking = true;
        s.thinkingText = THINKING_PHRASES[Math.floor(Math.random() * THINKING_PHRASES.length)];
        s.thinkingTimer = 5000;
        bubbles[s.id].textContent = s.thinkingText;
        bubbles[s.id].classList.add('visible');
      };

      window.electronAPI.onSetSoundsEnabled = (enabled) => {
        // handled by main process
      };
    }
  </script>
</body>
</html>
